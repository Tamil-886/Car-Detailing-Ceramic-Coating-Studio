<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | APEX OBSIDIAN Portal</title>
    <meta name="description" content="Reset your APEX OBSIDIAN studio portal password.">
    
        <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
    <link rel="shortcut icon" href="assets/images/favicon/favicon.ico">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; background: radial-gradient(circle at 80% 20%, rgba(212,175,55,0.08) 0%, transparent 60%), radial-gradient(circle at 20% 80%, rgba(0,240,255,0.06) 0%, transparent 60%), var(--bg-primary); padding: 40px 15px;">

    <div style="max-width: 460px; width: 100%; margin: 0 auto;">
        <div style="text-align: center; margin-bottom: 25px;">
            <a href="index.html" class="logo" style="display: inline-flex; justify-content: center;">
                <span class="logo-mark"><i class="ri-car-fill"></i></span>
                <span class="logo-text">APEX<span class="logo-accent">OBSIDIAN</span></span>
            </a>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 8px;">Customer Portal Recovery</p>
        </div>

        <div class="glass-card" style="padding: 35px; border-radius: 22px; border-color: rgba(212,175,55,0.25); box-shadow: 0 25px 60px rgba(0,0,0,0.6);">
            <h2 style="font-size: 1.5rem; margin: 0 0 6px;">Reset Password</h2>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 20px;">
                Enter your registered client email address. We will send you a secure 6-digit access code.
            </p>

            <!-- Dynamic Notification / Status Alert -->
            <div id="forgot-alert" class="auth-alert" style="display: none;"></div>

            <form id="apex-forgot-form" novalidate onsubmit="handleForgot(event)">
                <div style="margin-bottom: 22px;">
                    <label class="form-label" for="forgot-email" style="font-size: 0.85rem;">Registered Email *</label>
                    <div style="position: relative;">
                        <input type="email" id="forgot-email" class="form-control" placeholder="vance@exoticmotors.com" required style="padding-left: 40px;">
                        <i class="ri-mail-line" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;"></i>
                    </div>
                    <span id="forgot-error-msg" class="field-error-msg" style="display: none;"></span>
                </div>

                <button type="submit" id="forgot-submit-btn" class="btn btn-gold w-100" style="padding: 12px; font-weight: 700;">
                    <i class="ri-mail-send-line"></i> Send Recovery Code
                </button>
            </form>

            <div style="text-align: center; margin-top: 25px; font-size: 0.85rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 20px;">
                Remember your password? <a href="login.html" class="text-gold" style="font-weight: 600;">Back to Login</a>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">
                <i class="ri-arrow-left-line"></i> Return to Studio Main Website
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('forgot-alert');
            if (!alertBox) return;
            alertBox.className = `auth-alert auth-alert-${type}`;
            const icon = type === 'success' ? 'ri-checkbox-circle-fill' : (type === 'info' ? 'ri-information-line' : 'ri-error-warning-fill');
            alertBox.innerHTML = `<i class="${icon}" style="font-size: 1.15rem; flex-shrink: 0;"></i> <span>${message}</span>`;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            const alertBox = document.getElementById('forgot-alert');
            if (alertBox) alertBox.style.display = 'none';
        }

        function handleForgot(e) {
            e.preventDefault();
            hideAlert();
            const emailInput = document.getElementById('forgot-email');
            const errorMsg = document.getElementById('forgot-error-msg');
            const submitBtn = document.getElementById('forgot-submit-btn');

            emailInput.classList.remove('is-invalid');
            errorMsg.style.display = 'none';

            const email = (emailInput.value || '').trim();

            if (!email) {
                emailInput.classList.add('is-invalid');
                errorMsg.textContent = 'Please enter your registered email address.';
                errorMsg.style.display = 'block';
                return;
            }

            if (!ApexAuth.validateEmail(email)) {
                emailInput.classList.add('is-invalid');
                errorMsg.textContent = 'Please enter a valid email format (name@domain.com).';
                errorMsg.style.display = 'block';
                return;
            }

            const originalHTML = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="ri-loader-4-line spin"></i> Dispatching Recovery Code...';

            setTimeout(() => {
                const users = ApexAuth.getUsers();
                const userExists = users.some(u => u.email.toLowerCase() === email.toLowerCase());

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="ri-check-line"></i> Code Dispatched';

                if (userExists) {
                    showAlert(`🔒 Security recovery code dispatched to ${email}. Please check your inbox to reset your password.`, 'success');
                } else {
                    showAlert(`If an account is associated with ${email}, password reset instructions have been dispatched.`, 'info');
                }
            }, 800);
        }
    </script>
</body>
</html>
