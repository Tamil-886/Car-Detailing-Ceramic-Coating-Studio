<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="apexGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#090C12" />
    </linearGradient>
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>

  <!-- Squircle Obsidian Badge Container -->
  <rect x="20" y="20" width="472" height="472" rx="120" ry="120" fill="url(#apexBg)" stroke="url(#apexGold)" stroke-width="18" />

  <!-- Inner Subtle Ambient Glow Rim -->
  <rect x="38" y="38" width="436" height="436" rx="104" ry="104" fill="none" stroke="rgba(212, 175, 55, 0.2)" stroke-width="3" />

  <!-- Aerodynamic Supercar Silhouette & Optical Detailing Curves -->
  <g fill="url(#apexGold)" transform="translate(4, 8)">
    <!-- Cabin Roofline & Windshield Fastback Arc -->
    <path d="M140 270 C175 200, 230 165, 305 165 C345 165, 385 185, 412 225 C416 230, 412 238, 404 238 L148 238 C142 238, 137 248, 140 270 Z" opacity="0.3" />
    
    <!-- Bold Sleek Supercar Profile -->
    <path d="M75 320 C85 305, 105 292, 130 286 C155 240, 205 185, 300 178 C355 174, 400 205, 428 258 C450 268, 465 285, 472 312 C476 326, 466 338, 452 338 L432 338 C428 308, 402 284, 370 284 C338 284, 312 308, 308 338 L198 338 C194 308, 168 284, 136 284 C104 284, 78 308, 74 338 L58 338 C46 338, 38 328, 42 316 C48 298, 60 305, 75 320 Z" />

    <!-- Rear Performance Wheel -->
    <circle cx="136" cy="336" r="38" fill="url(#apexBg)" stroke="url(#apexGold)" stroke-width="12" />
    <circle cx="136" cy="336" r="14" fill="url(#apexGold)" />

    <!-- Front Performance Wheel -->
    <circle cx="370" cy="336" r="38" fill="url(#apexBg)" stroke="url(#apexGold)" stroke-width="12" />
    <circle cx="370" cy="336" r="14" fill="url(#apexGold)" />

    <!-- Aerodynamic Ground Effect / Speed Line -->
    <path d="M50 365 L462 365" stroke="url(#apexGold)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- 10H Ceramic Diamond Sparkle Star (Top Right) -->
  <g transform="translate(375, 95)" fill="url(#apexGold)">
    <!-- 4-point Diamond Starburst -->
    <path d="M0 -36 C2 -12, 12 -2, 36 0 C12 2, 2 12, 0 36 C-2 12, -12 2, -36 0 C-12 -2, -2 -12, 0 -36 Z" fill="url(#apexGold)" />
    <!-- Center Cyan Optical Spark -->
    <circle cx="0" cy="0" r="7" fill="url(#cyanSpark)" />
  </g>
</svg>