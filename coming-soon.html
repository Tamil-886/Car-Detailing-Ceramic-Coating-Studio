<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expansion Lab Coming Soon | APEX OBSIDIAN</title>
    <meta name="description" content="APEX OBSIDIAN Las Vegas Hypercar Cleanroom & Dyno Detailing Facility launching soon. Reserve private VIP access.">
    
        <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
    <link rel="shortcut icon" href="assets/images/favicon/favicon.ico">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, rgba(0,240,255,0.08) 0%, transparent 60%), var(--bg-primary); padding: 40px 20px; text-align: center;">

    <div style="max-width: 680px; width: 100%;">
        <div style="margin-bottom: 25px;">
            <a href="index.html" class="logo" style="display: inline-flex; justify-content: center;">
                <span class="logo-mark"><i class="ri-car-fill"></i></span>
                <span class="logo-text">APEX<span class="logo-accent">OBSIDIAN</span></span>
            </a>
        </div>

        <div class="glass-card" style="padding: 45px 35px; border-radius: 24px; border-color: var(--border-cyan); box-shadow: 0 30px 70px rgba(0,0,0,0.6);">
            <span class="badge badge-cyan" style="margin-bottom: 15px;"><i class="ri-rocket-fill"></i> Expansion Facility</span>
            <h1 style="font-size: clamp(2rem, 4vw, 2.8rem); margin: 0 0 15px; font-weight: 800;">
                Las Vegas Hypercar Lab
            </h1>
            <p style="color: var(--text-secondary); font-size: 1rem; line-height: 1.7; margin-bottom: 35px; max-width: 520px; margin-left: auto; margin-right: auto;">
                We are engineering a 15,000 sq ft hypercar cleanroom featuring 12 positive-pressure bays, automated turntable Scangrip lighting, and private concierge vaults.
            </p>

            <!-- Countdown Timer -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 35px; max-width: 480px; margin-left: auto; margin-right: auto;">
                <div class="glass-card" style="padding: 15px 5px; border-radius: 12px;">
                    <div style="font-size: 2rem; font-weight: 800; color: var(--primary-gold);" id="count-days">42</div>
                    <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Days</span>
                </div>
                <div class="glass-card" style="padding: 15px 5px; border-radius: 12px;">
                    <div style="font-size: 2rem; font-weight: 800; color: var(--primary-cyan);" id="count-hours">16</div>
                    <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Hours</span>
                </div>
                <div class="glass-card" style="padding: 15px 5px; border-radius: 12px;">
                    <div style="font-size: 2rem; font-weight: 800; color: var(--text-primary);" id="count-mins">28</div>
                    <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Minutes</span>
                </div>
                <div class="glass-card" style="padding: 15px 5px; border-radius: 12px;">
                    <div style="font-size: 2rem; font-weight: 800; color: var(--primary-gold);" id="count-secs">54</div>
                    <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Seconds</span>
                </div>
            </div>

            <!-- VIP Signup Form -->
            <form id="apex-newsletter-form" style="max-width: 440px; margin: 0 auto; display: flex; gap: 8px;">
                <input type="email" placeholder="Your VIP email for early access..." class="form-control" required style="font-size: 0.85rem;">
                <button type="submit" class="btn btn-cyan"><i class="ri-vip-crown-fill"></i> Get VIP Invite</button>
            </form>
        </div>

        <div style="margin-top: 25px;">
            <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">
                <i class="ri-arrow-left-line"></i> Back to Main Showroom Website
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/forms.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        // Simple live countdown timer
        let secs = 54;
        let mins = 28;
        setInterval(() => {
            secs--;
            if (secs < 0) {
                secs = 59;
                mins--;
                document.getElementById('count-mins').textContent = mins;
            }
            document.getElementById('count-secs').textContent = secs < 10 ? '0' + secs : secs;
        }, 1000);
    </script>
</body>
</html>
